```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameDock - Create Account</title>

    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

<div class="account-bar">
    <div class="account-links">
        <a href="login.html">Login</a>
        <span>|</span>
        <a href="register.html">Create Account</a>
    </div>
</div>


<header class="hero">
    <h1>GameDock</h1>
</header>


<nav>
    <a href="index.html">Home</a>
    <a href="games.html">Games</a>
    <a href="accessories.html">Accessories</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">
        Cart (<span class="cart-count">0</span>)
    </a>
</nav>


<div class="container">

    <div class="register-container">

        <h2>Create Your GameDock Account</h2>

        <p>
            Create an account to place orders and keep track of your purchases.
        </p>


        <form id="register-form">

            <div class="form-row">

                <div class="form-group">
                    <label for="firstName">First Name</label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        placeholder="First name"
                        required>
                </div>


                <div class="form-group">
                    <label for="lastName">Last Name</label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        placeholder="Last name"
                        required>
                </div>

            </div>


            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>

            </div>


            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Re-enter your password"
                    required>

            </div>


            <div class="account-agreement">

                <label>
                    <input
                        type="checkbox"
                        id="terms"
                        required>

                    I agree to the GameDock terms and conditions.
                </label>

            </div>


            <button
                type="submit"
                class="register-button">

                Create Account

            </button>

        </form>


        <div class="login-link">

            <p>
                Already have a GameDock account?
            </p>

            <a
                href="login.html"
                class="button">

                Login

            </a>

        </div>

    </div>

</div>


<footer>
    <p>&copy; 2026 GameDock | Built for Gamers 🎮</p>
</footer>


<script src="../assets/js/register.js"></script>

</body>

</html>
```
